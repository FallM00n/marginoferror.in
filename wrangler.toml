name = "marginoferror-in"
main = "worker/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./_site"
binding = "ASSETS"
not_found_handling = "404-page"

# Reactions storage (Cloudflare KV).
# 1. In Cloudflare: Storage & databases > KV > Create, name it "moe-reactions".
# 2. Copy its ID, then delete the "# " at the start of the three lines below
#    and paste the ID in place of PASTE_YOUR_KV_ID_HERE. Commit.
# Until then the site works normally and the reaction buttons stay hidden.
 [[kv_namespaces]]
 binding = "REACTIONS"
 id = "19cf05d1be584a409d8a8051ce4f681c"
